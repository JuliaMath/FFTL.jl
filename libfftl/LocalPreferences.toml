# The trimmed image keeps only what the entry points reach: the package precompile workload
# would only lengthen the build.
[FFTL]
precompile_workload = "none"
# juliac compiles nothing at run time, so every codelet is compiled with the package and none on
# first use.
lazy_radices = []
# 256-bit kernels only. The 512-bit complex addsub uses an AVX-512 intrinsic that the x86-64-v3
# target of the trimmed build cannot legalize (LLVM: "Do not know how to split the result").
simd_bytes = 32
