name: libfftl
# The C library (juliac --trim=safe): keeps FFTL's plan and execution path trimmable. The build
# fails on any trim verifier error. Weekly as well, so that new Julia releases are caught.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  libfftl:
    name: libfftl - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: FFTW3 interface in Julia against FFTW.jl (no build)
        working-directory: libfftl
        run: |
          julia --project=test -e 'using Pkg; Pkg.instantiate()'
          julia -t 4 --project=test test/fftw3_jltest.jl
      - name: Build the trimmed library and the C test
        run: libfftl/build.sh
      - name: FFTW3 symbols
        run: libfftl/test/fftw3_symbols.sh
      - name: FFTW3 differential C test (against FFTW_jll)
        run: libfftl/test/fftw3_ctest.sh
      - name: FFTW3 Fortran test (against FFTW_jll)
        run: |
          FC=$(command -v gfortran || command -v gfortran-15 || command -v gfortran-14 || command -v gfortran-13 || true)
          if [ -z "$FC" ]; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install gcc
              FC=$(ls "$(brew --prefix)"/bin/gfortran-* | head -1)
            else
              sudo apt-get update && sudo apt-get install -y gfortran
              FC=gfortran
            fi
          fi
          FC="$FC" libfftl/test/fftw3_ftest.sh
      - name: Bundle size
        run: |
          {
            echo "### libfftl bundle (${{ matrix.os }})"
            echo '```'
            du -sh libfftl/build libfftl/build/lib/libfftl.* libfftl/build/lib/julia
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
