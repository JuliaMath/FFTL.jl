name: CI

# Quick tests on every push and pull request on Linux x86, Windows x86 and macOS aarch64 (the
# SIMD paths), and on Linux with code generation targets below the runner's CPU; coverage from
# the Linux job on pushes to main (instrumentation recompiles every dependency and slows the
# tests). Weekly and on demand: the full test lists with bounds
# checking, and the oldest supported Julia (LTS).
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full test lists'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write   # julia-actions/cache deletes outdated caches

jobs:
  test:
    name: Julia ${{ matrix.version }} · ${{ matrix.os }}${{ matrix.large_primes == 'bluestein' && ' · Float64 Bluestein' || '' }}${{ matrix.cpu_features == 'baseline' && ' · baseline CPU' || '' }}${{ matrix.cpu_target && format(' · -C {0}', matrix.cpu_target) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1']
        os: [ubuntu-latest, windows-latest, macos-latest]
        large_primes: [resample]
        cpu_features: [host]
        cpu_target: ['']   # '' = Julia's default (native); set in the entries below
        include:
          # the preference float64_large_primes = "bluestein" (Bluestein's algorithm for every
          # Float64 transform of a length with a prime factor above 73)
          - {version: '1', os: ubuntu-latest, large_primes: bluestein}
          - {version: '1', os: macos-latest, large_primes: bluestein}
          # the preference cpu_features = "baseline" (16-byte kernels without AVX2 or AVX-512)
          - {version: '1', os: ubuntu-latest, large_primes: resample, cpu_features: baseline}
          # on aarch64 also without FCADD/FCMLA
          - {version: '1', os: macos-latest, large_primes: resample, cpu_features: baseline}
          # Julia compiles for a target with fewer features than the CPU reports (`-C`, or a
          # system image whose closest target has narrower vector registers): x86-64 has no AVX,
          # haswell no AVX-512 (relevant when the runner has it)
          - {version: '1', os: ubuntu-latest, large_primes: resample, cpu_features: host, cpu_target: x86-64}
          - {version: '1', os: ubuntu-latest, large_primes: resample, cpu_features: host, cpu_target: haswell}
    env:
      JULIA_NUM_THREADS: 2
      COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.large_primes == 'resample' && matrix.cpu_features == 'host' && !matrix.cpu_target && github.event_name == 'push' }}
      FFTL_TEST_FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Preferences
        if: matrix.large_primes == 'bluestein' || matrix.cpu_features == 'baseline'
        run: |
          printf '[FFTL]\n' > LocalPreferences.toml
          if [ "${{ matrix.large_primes }}" = bluestein ]; then
            printf 'float64_large_primes = "bluestein"\n' >> LocalPreferences.toml
          fi
          if [ "${{ matrix.cpu_features }}" = baseline ]; then
            printf 'cpu_features = "baseline"\n' >> LocalPreferences.toml
          fi
          cat LocalPreferences.toml
      - uses: julia-actions/julia-buildpkg@v1
      # --check-bounds=yes (disables @inbounds and invalidates all precompiled packages) only in
      # the full run: it triples the time of the quick run
      - uses: julia-actions/julia-runtest@v1
        if: ${{ !matrix.cpu_target }}
        with:
          coverage: ${{ env.COVERAGE }}
          check_bounds: ${{ env.FFTL_TEST_FULL == 'true' && 'yes' || 'auto' }}
      # Pkg.test passes -C on to the test process and to precompilation
      - name: Test with -C ${{ matrix.cpu_target }}
        if: ${{ matrix.cpu_target }}
        run: |
          julia --color=yes -C ${{ matrix.cpu_target }} --project=. -e '
            using InteractiveUtils; versioninfo()
            using Pkg; Pkg.test()'
      - uses: julia-actions/julia-processcoverage@v1
        if: env.COVERAGE == 'true'
      # line coverage in the run summary (visible without access to Codecov)
      - name: Coverage summary
        if: env.COVERAGE == 'true'
        run: |
          awk -F: '/^SF:/ { f = $2; sub(/.*\/src\//, "src/", f) }
                   /^LF:/ { lf[f] += $2; LF += $2 }
                   /^LH:/ { lh[f] += $2; LH += $2 }
                   END {
                     printf "### Line coverage: %.1f %% (%d of %d lines)\n\n| file | lines | covered |\n|---|---:|---:|\n", 100 * LH / LF, LH, LF
                     for (k in lf) printf "| %s | %d | %.1f %% |\n", k, lf[k], (lf[k] ? 100 * lh[k] / lf[k] : 100) | "sort"
                   }' lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v5
        if: env.COVERAGE == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # the oldest supported Julia (compat bound), quick lists: weekly and on demand
  lts:
    name: Julia lts · ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: 'lts'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'auto'
