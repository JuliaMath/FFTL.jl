name: CI

# Quick tests on every push and pull request (Linux x86 and macOS aarch64, the two SIMD paths;
# the oldest supported Julia on Linux), coverage from the Linux job. The full test lists
# (FFTL_TEST_FULL, with bounds checking) run weekly and on demand.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full test lists'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write   # julia-actions/cache deletes outdated caches

jobs:
  test:
    name: Julia ${{ matrix.version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '1', os: ubuntu-latest, coverage: true }
          - { version: '1', os: macos-latest, coverage: false }
          - { version: 'lts', os: ubuntu-latest, coverage: false }
    env:
      JULIA_NUM_THREADS: 2
      FFTL_TEST_FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # --check-bounds=yes (disables @inbounds and invalidates all precompiled packages) only in
      # the full run: it triples the time of the quick run
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
          check_bounds: ${{ env.FFTL_TEST_FULL == 'true' && 'yes' || 'auto' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
