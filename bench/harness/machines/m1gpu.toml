# Machine profile: Apple M1 Max GPU (Metal), run on the Mac itself. The profile label is the public
# processor name; the GPU is the device of that machine.

id = "m1gpu"
label = "Apple M1 Max"
device = "metal"                  # gpu.jl: Metal.jl, Float32 only
project = "envs/metal"              # Metal, KernelAbstractions, FFTL dev'd
threads = [0]                     # no CPU threads; the monitor starts Julia with one thread
max_load = 8.0
libs = ["fftl", "mpsgraph", "vkfft"]
