# Panels of the benchmark figures (fig_speedup.jl, fig_standing.jl).
#
# Each panel is one aggregated table, results/panel-<key>.csv: one row per case and library, with
# the statistics written by the benchmark harness (harness/aggregate.jl, columns in its header).
# The figures read only these tables. `sources` names the harness runs a panel was aggregated from;
# their .meta files are concatenated into results/panel-<key>.meta.
# `competitors` are the libraries that take part in the panel; FFTL is always in.
# `machine` is the public processor name written into the tables.

[[panel]]
key = "m1t1"
title = "Apple M1 Max CPU, 1 thread"
machine = "Apple M1 Max"
competitors = ["fftw_measure", "ducc", "vdsp"]
sources = ["campaign run 2026-11-15, FFTL v0.2.0, 1 thread"]

[[panel]]
key = "epyct1"
title = "AMD EPYC 7763 CPU, 1 thread"
machine = "AMD EPYC 7763"
competitors = ["fftw_measure", "ducc"]
sources = ["campaign run 2026-11-15, FFTL v0.2.0, 1 thread, socket 0"]

[[panel]]
key = "m1gpu"
title = "Apple M1 Max GPU"
machine = "Apple M1 Max"
competitors = ["mpsgraph", "vkfft"]
sources = ["campaign run 2026-11-15, FFTL v0.2.0, Metal, Float32"]

[[panel]]
key = "m1t8"
title = "Apple M1 Max CPU, 8 threads"
machine = "Apple M1 Max"
competitors = ["fftw_measure", "ducc"]
# each library at its better of 1 and 8 threads per case
sources = ["campaign runs 2026-11-15, FFTL v0.2.0, 1 and 8 threads"]

[[panel]]
key = "epyct32"
title = "AMD EPYC 7763 CPU, 32 threads"
machine = "AMD EPYC 7763"
competitors = ["fftw_measure", "ducc"]
# each library at its best of 1, 16 and 32 threads per case
sources = ["campaign runs 2026-11-15, FFTL v0.2.0, 1, 16 and 32 threads, socket 0"]

[[panel]]
key = "a6000"
title = "NVIDIA RTX A6000 GPU"
machine = "NVIDIA RTX A6000"
competitors = ["cufft", "vkfft"]
sources = ["campaign run 2026-11-15, FFTL v0.2.0"]
